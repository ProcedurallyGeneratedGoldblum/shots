<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shots</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1b1b1b; --muted: #6b6b6b;
    --line: #e2e2de; --accent: #2b6cb0; --danger: #c53030; --shade: rgba(0,0,0,.88);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --panel: #1e1e1e; --text: #ececec; --muted: #9a9a9a;
            --line: #2c2c2c; --accent: #63a4ff; --danger: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center;
           padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header input { flex: 1; max-width: 360px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line);
                 border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  #count { color: var(--muted); margin-left: auto; white-space: nowrap; }
  main { padding: 8px 16px 40px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
       letter-spacing: .05em; margin: 20px 0 10px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .tile { position: relative; aspect-ratio: 16/10; border-radius: 6px; overflow: hidden; cursor: pointer;
          background: var(--panel); border: 1px solid var(--line); padding: 0; }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .badge { position: absolute; bottom: 6px; left: 6px; font-size: 11px; padding: 1px 6px;
                 border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #msg { padding: 40px 0; text-align: center; color: var(--muted); }
  #more { display: none; margin: 24px auto 0; font: inherit; padding: 8px 16px; border-radius: 6px;
          border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  #lb { position: fixed; inset: 0; z-index: 10; background: var(--shade); display: none; flex-direction: column; }
  #lb.open { display: flex; }
  #lb .bar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; color: #eee; }
  #lb .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  #lb button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #555;
               background: #2a2a2a; color: #eee; cursor: pointer; }
  #lb button.del { border-color: #ff6b6b; color: #ff6b6b; }
  #lb .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px 16px; min-height: 0; }
  #lb .stage img, #lb .stage video { max-width: 100%; max-height: 100%; object-fit: contain; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
           background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 6px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    #lb .bar { flex-wrap: wrap; }
    #lb .name { flex-basis: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Shots</h1>
  <input id="q" type="search" placeholder="Filter by name…" autocomplete="off">
  <span id="count"></span>
</header>
<main>
  <div id="gallery"></div>
  <div id="msg">Loading…</div>
  <button id="more">Load more</button>
</main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Preview">
  <div class="bar">
    <span class="name" id="lbName"></span>
    <button id="lbCopy">Copy link</button>
    <button id="lbOpen">Open</button>
    <button id="lbDel" class="del">Delete</button>
    <button id="lbClose" aria-label="Close">✕</button>
  </div>
  <div class="stage" id="lbStage"></div>
</div>
<div id="toast" role="status"></div>

<script>
const VIDEO = /\.(mp4|webm|mov)$/i;
let items = [], base = '', cursor = null, view = [], current = -1;

const $ = id => document.getElementById(id);
const urlFor = key => base + '/' + key.split('/').map(encodeURIComponent).join('/');
const fileName = key => key.split('/').pop();
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const monthOf = iso => new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'long' });

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 1600);
}

async function load() {
  $('more').disabled = true;
  try {
    const r = await fetch('/api/list' + (cursor ? '?cursor=' + encodeURIComponent(cursor) : ''));
    if (r.status === 403) throw new Error('Not authorized. Is Cloudflare Access set up for this site?');
    if (!r.ok) throw new Error('Could not load the list (' + r.status + ').');
    const d = await r.json();
    base = d.base;
    items = items.concat(d.objects).sort((a, b) => b.uploaded.localeCompare(a.uploaded));
    cursor = d.cursor;
    render();
  } catch (e) {
    $('msg').style.display = 'block'; $('msg').textContent = e.message;
  }
  $('more').disabled = false;
}

function media(key, full) {
  const src = urlFor(key);
  if (VIDEO.test(key)) {
    const v = document.createElement('video');
    v.src = src; v.preload = 'metadata'; v.playsInline = true;
    if (full) { v.controls = true; v.autoplay = true; } else { v.muted = true; }
    return v;
  }
  const img = document.createElement('img');
  img.src = src; img.alt = fileName(key); img.loading = full ? 'eager' : 'lazy'; img.decoding = 'async';
  return img;
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  view = q ? items.filter(o => o.key.toLowerCase().includes(q)) : items;
  $('count').textContent = view.length + (view.length === 1 ? ' item' : ' items') + (cursor ? '+' : '');
  $('msg').style.display = view.length ? 'none' : 'block';
  $('msg').textContent = items.length ? 'No matches.' : 'Nothing uploaded yet.';
  $('more').style.display = cursor ? 'block' : 'none';

  const g = $('gallery'); g.replaceChildren();
  let month = null, grid = null;
  view.forEach((o, i) => {
    const m = monthOf(o.uploaded);
    if (m !== month) {
      month = m;
      const h = document.createElement('h2'); h.textContent = m; g.append(h);
      grid = document.createElement('div'); grid.className = 'grid'; g.append(grid);
    }
    const tile = document.createElement('button');
    tile.className = 'tile'; tile.title = fileName(o.key) + ' · ' + fmtSize(o.size);
    tile.append(media(o.key, false));
    if (VIDEO.test(o.key)) {
      const b = document.createElement('span'); b.className = 'badge'; b.textContent = 'video'; tile.append(b);
    }
    tile.onclick = () => openLb(i);
    grid.append(tile);
  });
}

function openLb(i) {
  current = i;
  const o = view[i];
  $('lbName').textContent = fileName(o.key) + ' · ' + fmtSize(o.size) + ' · ' + new Date(o.uploaded).toLocaleString();
  $('lbStage').replaceChildren(media(o.key, true));
  $('lb').classList.add('open');
}
function closeLb() { $('lb').classList.remove('open'); $('lbStage').replaceChildren(); current = -1; }

$('lbCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(urlFor(view[current].key)); toast('Link copied'); }
  catch { toast('Copy failed'); }
};
$('lbOpen').onclick = () => window.open(urlFor(view[current].key), '_blank', 'noopener');
$('lbDel').onclick = async () => {
  const o = view[current];
  if (!confirm('Delete ' + fileName(o.key) + '? Its public link will stop working.')) return;
  const r = await fetch('/api/delete', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: o.key })
  });
  if (!r.ok) { toast('Delete failed (' + r.status + ')'); return; }
  items = items.filter(x => x.key !== o.key);
  closeLb(); render(); toast('Deleted');
};
$('lbClose').onclick = closeLb;
$('lb').onclick = e => { if (e.target.id === 'lb' || e.target.id === 'lbStage') closeLb(); };
document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight' && current < view.length - 1) openLb(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) openLb(current - 1);
});
$('q').addEventListener('input', render);
$('more').onclick = load;

load();
</script>
</body>
</html>
